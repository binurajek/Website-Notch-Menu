<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding Notch Header</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header" id="header">
        <div class="notch-label">Menu</div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Portfolio</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Website</h1>
        <p>Hover over the blue notch at the top to see the menu.</p>
        <p>The header will expand to fill the width.</p>
    </main>

    <script src="script.js"></script>
</body>

</html>
